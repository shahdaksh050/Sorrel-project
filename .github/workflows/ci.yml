name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Lint, types, tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.13"]
        include:
          # pyproject.toml declares >=3.11; keep the floor under test.
          - os: ubuntu-latest
            python: "3.11"
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src/

      - name: Tests
        run: pytest -m "not slow" -q

      - name: Validate
        run: python scripts/validate.py

      - name: Dry run
        run: python scripts/dry_run.py

      # Baseline was recorded on a Windows dev box; CI hardware differs, so
      # this reports regressions but never blocks the build.
      - name: Performance budget
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        run: python scripts/bench.py --check

  ui-smoke:
    name: Browser smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt playwright
          playwright install --with-deps chromium

      - name: Run the sample analysis in a browser
        run: python scripts/ui_smoke.py
