# Theme: "Ledger" (buff-green paper, ink, one terracotta pen).
# The colour keys in the generated block below are a copy of the Day palette in
# src/core/design_tokens.py. Change a colour there, then run:
#   python scripts/sync_streamlit_theme.py
# Everything outside the generated block is hand-edited.
#
# There are no [theme.light] / [theme.dark] sections on purpose: Streamlit would
# then pick its native theme from the browser's colour scheme, and the app's own
# Day/Night toggle could not keep native widgets in step with the page. Night mode
# is the app's CSS (ui/styles.py) over this one fixed native theme.

[server]
# Serves ./static (the self-hosted fonts and the vendored Vega bundles) at /app/static.
enableStaticServing = true

[theme]
font = "Mukta, 'Segoe UI', sans-serif"
headingFont = "'Baloo 2', 'Mukta', 'Segoe UI', sans-serif"
codeFont = "'Cascadia Code', Consolas, monospace"
baseRadius = "14px"                           # Warm and rounded, not drafted
buttonRadius = "999px"
chartCategoricalColors = ["#A34F20", "#A33526", "#C08A2E", "#5B8C5A", "#8A7660", "#B5714A"]

# BEGIN generated by scripts/sync_streamlit_theme.py. Do not edit by hand.
primaryColor = "#a34f20"
backgroundColor = "#eef1e0"
secondaryBackgroundColor = "#e6e9d6"
textColor = "#33362a"
dataframeBorderColor = "#a9bfd1"
dataframeHeaderBackgroundColor = "#e6e9d6"
# END generated
