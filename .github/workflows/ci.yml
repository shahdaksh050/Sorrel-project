name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    name: Lint, types, tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Ruff
        run: ruff check .

      - name: Mypy
        run: mypy src/

      - name: Tests
        run: pytest -m "not slow" -q

      - name: Validate
        run: python scripts/validate.py

      - name: Dry run
        run: python scripts/dry_run.py

      # Baseline was recorded on a Windows dev box; CI hardware differs, so
      # this reports regressions but never blocks the build.
      - name: Performance budget
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        run: python scripts/bench.py --check
