<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
__FONT_LINKS__
<style>
  /* The Sorrel tokens for this theme, from src/core/design_tokens.py (one source; no hex is typed here).
     --pen is a fill (green); text uses --accent-text, and --accent (amber) is the only "look twice" colour.
     --risk means "this may not hold" and is not used by the plate: a stage that failed to run is amber. */
  :root {
__ROOT_TOKENS__
    --sans: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --heading: 'Geist', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    --mono: 'Geist Mono', 'JetBrains Mono', ui-monospace, Consolas, monospace;
    --radius: 4px;

    /* MOTION CONTRACT (Synchronized with cinematic_3d) */
    --dur-micro: 180ms;
    --dur-ui: 320ms;
    --dur-stage: 950ms;
    --dur-cinematic: 1400ms;
    --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
    --ease-in-out: cubic-bezier(0.65, 0, 0.35, 1);
  }

  html, body {
    margin: 0;
    height: 100%;
    width: 100%;
    background: transparent;
    overflow: hidden;
    font-family: var(--sans);
    user-select: none;
    -webkit-user-select: none;
  }

  #stage {
    position: relative;
    height: 100%;
    width: 100%;
  }

  #scene {
    position: absolute;
    inset: 0;
    touch-action: pan-y;
  }

  #scene canvas {
    display: block;
    width: 100% !important;
    height: 100% !important;
  }

  #scene canvas:focus-visible {
    outline: 2px solid var(--accent-text);
    outline-offset: -2px;
  }

  /* Floating HUD Overlay Layer */
  #hud-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
  }

  /* 3D Floating Stage Callout Tag */
  .hud-pin {
    position: absolute;
    transform: translate(-50%, -100%);
    opacity: 0;
    transition: opacity 0.22s ease, transform 0.22s cubic-bezier(0.16, 1, 0.3, 1);
    pointer-events: none;
    z-index: 10;
  }

  .hud-pin.active {
    opacity: 1;
    transform: translate(-50%, -115%);
  }

  /* A label, not a control: a hairline card, square corners, no shadow. */
  .hud-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--sheet);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 4px 10px;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 11.5px;
    color: var(--ink);
    white-space: nowrap;
  }

  .hud-badge .step {
    font-family: var(--mono);
    font-weight: 600;
    color: var(--accent-text);
  }

  /* A stage that failed to run: amber (look twice), never the "may not hold" brick. */
  .hud-badge.err { border-color: var(--accent); }
  .hud-badge.err .step { color: var(--accent); }

  .hud-pointer {
    width: 1px;
    height: 12px;
    background: var(--rule);
    margin: 0 auto;
  }

  /* View toolbar: real buttons, so these may react to the pointer. */
  #cad-toolbar {
    position: absolute;
    top: 10px;
    right: 12px;
    display: flex;
    align-items: center;
    gap: 2px;
    background: var(--sheet);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 3px;
    z-index: 20;
  }

  .cad-btn {
    font-family: var(--sans);
    font-size: 11.5px;
    font-weight: 600;
    background: transparent;
    border: none;
    color: var(--ink-2);
    padding: 5px 10px;
    cursor: pointer;
    line-height: 1;
    border-radius: 2px;
  }

  .cad-btn:hover {
    color: var(--ink);
    background: var(--sheet-alt);
  }

  .cad-btn:focus-visible {
    outline: 2px solid var(--accent-text);
    outline-offset: 1px;
  }

  .cad-btn.active {
    background: var(--pen);
    color: var(--accent-ink);
  }

  /* Readout panel in bottom-left */
  #readout {
    position: absolute;
    left: 12px;
    bottom: 10px;
    max-width: min(44ch, calc(100% - 140px));
    pointer-events: none;
    z-index: 15;
    background: var(--sheet);
    border: 1px solid var(--rule);
    border-radius: var(--radius);
    padding: 8px 12px;
  }

  #readout-title {
    margin: 0;
    font-family: var(--heading);
    font-weight: 600;
    font-size: 14.5px;
    line-height: 1.25;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  #readout-body {
    margin: 2px 0 0;
    font-family: var(--sans);
    font-size: 12px;
    line-height: 1.4;
    color: var(--ink-2);
  }

  #hint {
    position: absolute;
    right: 12px;
    bottom: 8px;
    margin: 0;
    font-family: var(--mono);
    font-weight: 500;
    font-size: 10.5px;
    color: var(--graphite);
    pointer-events: none;
  }

  .fallback-steps { margin: 0 20px 20px; padding-left: 1.4rem; font-size: 14px; line-height: 1.7; color: var(--ink); }
  .fallback-steps li.done::marker, .fallback-steps li.active::marker { color: var(--accent-text); }
  .fallback-steps li.error { color: var(--accent); }
  .fallback {
    padding: 24px;
    font-size: 14px;
    line-height: 1.6;
    max-width: 48ch;
    color: var(--ink-2);
    border-left: 3px solid var(--rule);
    margin: 20px;
  }

  @media (max-width: 640px) {
    #hint { display: none; }
    #readout { max-width: calc(100% - 24px); }
    #cad-toolbar { top: 6px; right: 6px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .hud-pin { transition: none; }
  }
</style>
</head>
<body>
  <div id="stage">
    <div id="scene"></div>
    <div id="hud-layer">
      <div id="hud-pin" class="hud-pin">
        <div id="hud-badge" class="hud-badge">
          <span id="hud-step" class="step">1</span>
          <span id="hud-text">Reading Your File</span>
        </div>
        <div class="hud-pointer"></div>
      </div>
    </div>
    <div id="cad-toolbar">
      <button id="btn-iso" class="cad-btn active" title="Angled view">3D</button>
      <button id="btn-plan" class="cad-btn" title="Top-down view">Top</button>
      <button id="btn-front" class="cad-btn" title="Front-on view">Front</button>
      <button id="btn-cinema" class="cad-btn" title="Cinematic Tour">Tour</button>
      <button id="btn-reset" class="cad-btn" title="Recenter" aria-label="Recenter the view">Reset</button>
    </div>
    <div id="readout">
      <p id="readout-title"></p>
      <p id="readout-body"></p>
    </div>
    <p id="hint">Drag to look around · [ / ] to step through</p>
  </div>

  <script>
    window.__PIPELINE_STATE__ = __STATE_JSON__;
    // Apply the palette from state as CSS variables (the same tokens the stylesheet above already carries)
    if (window.__PIPELINE_STATE__ && window.__PIPELINE_STATE__.palette) {
      const root = document.documentElement;
      for (const [key, value] of Object.entries(window.__PIPELINE_STATE__.palette)) {
        if (typeof value === 'string') root.style.setProperty('--' + key.replace(/_/g, '-'), value);
      }
    }
  </script>
  <script src="__GSAP_URL__"></script>
  <script>
    /* If GSAP did not load (no network), stand in for it: each tween applies its end state at once, so the
       scene still draws correctly, without the animation. Online, the real GSAP above is used unchanged. */
    (function () {
      if (window.gsap) return;
      var RESERVED = ["duration", "ease", "delay", "onUpdate", "onComplete", "onStart", "repeat", "yoyo",
                      "stagger", "overwrite", "immediateRender", "paused", "id"];
      function apply(target, vars) {
        (Array.isArray(target) ? target : [target]).forEach(function (t) {
          if (!t) return;
          for (var k in vars) if (RESERVED.indexOf(k) === -1) t[k] = vars[k];
        });
        if (vars && typeof vars.onUpdate === "function") vars.onUpdate();
        if (vars && typeof vars.onComplete === "function") vars.onComplete();
      }
      function timeline() {
        var tl = {
          to: function (t, v) { apply(t, v); return tl; },
          from: function () { return tl; },
          fromTo: function (t, f, v) { apply(t, v); return tl; },
          set: function (t, v) { apply(t, v); return tl; },
          call: function (fn) { if (typeof fn === "function") fn(); return tl; },
          add: function (x) { if (typeof x === "function") x(); return tl; },
          clear: function () { return tl; },
          kill: function () { return tl; }
        };
        return tl;
      }
      window.gsap = {
        to: function (t, v) { apply(t, v); },
        from: function () {},
        fromTo: function (t, f, v) { apply(t, v); },
        set: function (t, v) { apply(t, v); },
        timeline: timeline,
        globalTimeline: { clear: function () {} }
      };
    })();
  </script>
  <script type="module">
__SCENE_SCRIPT__
  </script>
</body>
</html>
